name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run regression tests
        run: dotnet test tests/UnitTests/UnitTests.csproj -c Release
      - name: Verify hidden native popup placement
        run: dotnet run --project tests/NativePlacementProbe -c Release
      - name: Build extension package
        shell: pwsh
        run: ./scripts/Build-Extension.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: artifacts/*.wsext
          if-no-files-found: error
